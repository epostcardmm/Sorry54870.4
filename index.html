<!DOCTYPE html>
<html lang="my">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Special Question For You ✨</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Pyidaungsu', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      background: linear-gradient(-45deg, #ff7eb3, #ff758c, #70a1ff, #2ed573, #ffbe76, #ff4757);
      background-size: 400% 400%;
      animation: gradientBG 12s ease infinite;
      overflow: hidden;
      position: relative;
    }

    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .bg-shape {
      position: absolute;
      font-size: 24px;
      user-select: none;
      pointer-events: none;
      animation: floatUp 8s linear infinite;
      opacity: 0.7;
    }

    @keyframes floatUp {
      0% {
        transform: translateY(100vh) rotate(0deg) scale(0.8);
        opacity: 0.8;
      }
      100% {
        transform: translateY(-10vh) rotate(360deg) scale(1.2);
        opacity: 0;
      }
    }

    .container {
      background: rgba(255, 255, 255, 0.92);
      backdrop-filter: blur(10px);
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2), 0 0 20px rgba(255, 255, 255, 0.5);
      text-align: center;
      max-width: 440px;
      width: 90%;
      z-index: 10;
      transition: all 0.4s ease;
      border: 3px solid rgba(255, 255, 255, 0.8);
      position: relative;
    }

    .step-badge {
      display: inline-block;
      padding: 5px 15px;
      background: linear-gradient(45deg, #ff4757, #ff758c);
      color: white;
      font-weight: bold;
      font-size: 13px;
      border-radius: 20px;
      margin-bottom: 15px;
      box-shadow: 0 4px 10px rgba(255, 71, 87, 0.3);
      letter-spacing: 0.5px;
    }

    .gif-container img {
      width: 170px;
      height: 170px;
      object-fit: cover;
      border-radius: 20px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.12);
      border: 4px solid #ffffff;
    }

    /* Frame မပါဘဲ နှိပ်လို့ရသော GIF အပြင်အဆင် */
    .intro-gif-clickable img {
      border: none !important;
      box-shadow: none !important;
      border-radius: 0 !important;
      cursor: pointer;
      transition: transform 0.3s ease;
    }
    
    .intro-gif-clickable img:hover {
      transform: scale(1.08);
    }

    h1 {
      font-size: 20px;
      color: #2c3e50;
      margin-bottom: 25px;
      line-height: 1.5;
      font-weight: 700;
    }

    .btn-group {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      position: relative;
      min-height: 50px;
      transition: transform 0.3s ease;
    }

    .btn-group.swapped {
      flex-direction: row-reverse;
    }

    button {
      padding: 12px 28px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      transition: transform 0.2s, background-color 0.2s, box-shadow 0.2s;
      outline: none;
    }

    .btn-yes {
      background: linear-gradient(45deg, #ff4b2b, #ff416c);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 75, 43, 0.4);
    }
    .btn-yes:hover {
      transform: scale(1.08);
      box-shadow: 0 6px 20px rgba(255, 75, 43, 0.6);
    }

    .btn-no {
      background: linear-gradient(45deg, #a8c0ff, #3f2b96);
      color: white;
      box-shadow: 0 4px 15px rgba(63, 43, 150, 0.3);
      transition: all 0.2s ease-out;
      z-index: 9999;
    }

    .btn-yes-step2 {
      background: linear-gradient(45deg, #11998e, #38ef7d);
      color: white;
      box-shadow: 0 4px 15px rgba(56, 239, 125, 0.4);
      transition: transform 0.2s;
    }
    .btn-yes-step2:hover {
      transform: scale(1.08);
    }

    .btn-no-step2 {
      background: linear-gradient(45deg, #ff9966, #ff5e62);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 94, 98, 0.4);
    }

    .btn-yes-step3 {
      background: linear-gradient(45deg, #ff007f, #7928ca);
      color: white;
      box-shadow: 0 4px 15px rgba(255, 0, 127, 0.4);
    }
    .btn-yes-step3:hover {
      transform: scale(1.08);
    }

    .btn-aung-step3 {
      background: linear-gradient(45deg, #f857a6, #ff5858);
      color: white;
      box-shadow: 0 4px 15px rgba(248, 87, 166, 0.4);
    }
    .btn-aung-step3:hover {
      transform: scale(1.08);
    }

    .btn-card {
      background: linear-gradient(45deg, #2b5876, #4e4376);
      color: white;
      margin-top: 15px;
      box-shadow: 0 4px 15px rgba(43, 88, 118, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    .envelope-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 20px;
      cursor: pointer;
      min-height: 360px;
      position: relative;
    }

    .envelope {
      position: relative;
      width: 330px;
      height: 210px;
      background: #ff4757;
      border-radius: 8px;
      box-shadow: 0 12px 25px rgba(0, 0, 0, 0.25);
    }

    .letter {
      position: absolute;
      top: 10px;
      left: 15px;
      width: 300px;
      height: 190px;
      background: #fffdf9;
      border-radius: 8px;
      padding: 15px;
      text-align: left;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
      transition: transform 0.6s ease-in-out, height 0.6s ease-in-out, z-index 0.3s, opacity 0.3s;
      z-index: 2;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border: 1px solid #eae2d6;
      opacity: 0;
      pointer-events: none;
    }

    .envelope::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-top: 105px solid transparent;
      border-bottom: 105px solid transparent;
      border-left: 165px solid #ff6b81;
      border-bottom-left-radius: 8px;
      border-top-left-radius: 8px;
      z-index: 3;
    }

    .envelope::after {
      content: '';
      position: absolute;
      top: 0;
      right: 0;
      width: 0;
      height: 0;
      border-top: 105px solid transparent;
      border-bottom: 105px solid transparent;
      border-right: 165px solid #ff6b81;
      border-bottom-right-radius: 8px;
      border-top-right-radius: 8px;
      z-index: 3;
    }

    .envelope-pocket {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 165px solid transparent;
      border-right: 165px solid transparent;
      border-bottom: 115px solid #ee5253;
      border-bottom-left-radius: 8px;
      border-bottom-right-radius: 8px;
      z-index: 4;
    }

    .envelope-flap {
      position: absolute;
      top: 0;
      left: 0;
      width: 0;
      height: 0;
      border-left: 165px solid transparent;
      border-right: 165px solid transparent;
      border-top: 120px solid #ee5253;
      transform-origin: top;
      transition: transform 0.6s ease-in-out, z-index 0.2s;
      z-index: 5;
      filter: drop-shadow(0 2px 3px rgba(0,0,0,0.15));
    }

    .letter-content {
      overflow-y: auto;
      max-height: 250px;
      padding-right: 6px;
    }

    .letter-content::-webkit-scrollbar {
      width: 5px;
    }

    .letter-content::-webkit-scrollbar-thumb {
      background: #ff758c;
      border-radius: 10px;
    }

    .letter p {
      font-size: 13px;
      color: #333;
      line-height: 1.7;
    }

    .mini-btn-group {
      display: flex;
      justify-content: space-around;
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed #ccc;
    }

    .mini-btn {
      padding: 6px 16px;
      font-size: 11px;
      border-radius: 15px;
      border: none;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .mini-btn-yes {
      background-color: #2ecc71;
      color: white;
    }

    .mini-btn-no {
      background-color: #e74c3c;
      color: white;
    }

    .envelope.open .envelope-flap {
      transform: rotateX(180deg);
      z-index: 1;
    }

    .envelope.open .letter {
      opacity: 1;
      pointer-events: auto;
      transform: translateY(-165px);
      height: 335px;
      z-index: 6;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
    }

    .instruction-text {
      font-size: 13px;
      color: #555;
      margin-top: 15px;
      font-style: italic;
    }

    .warning-popup {
      position: fixed;
      padding: 10px 18px;
      color: white;
      font-size: 14px;
      font-weight: bold;
      border-radius: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.25);
      pointer-events: none;
      animation: popup 1.5s ease-out forwards;
      z-index: 10000;
      white-space: nowrap;
    }

    .warning-theme-1 {
      background: linear-gradient(45deg, #ff3366, #ff0055);
    }

    .warning-theme-2 {
      background: linear-gradient(45deg, #7928ca, #ff0080);
    }

    @keyframes popup {
      0% { opacity: 0; transform: translateY(0) scale(0.8); }
      20% { opacity: 1; transform: translateY(-5px) scale(1.05); }
      80% { opacity: 1; }
      100% { opacity: 0; transform: translateY(-25px) scale(1); }
    }
  </style>
</head>
<body>

  <div id="bgParticles"></div>

  <div class="container" id="mainContainer"></div>

  <script>
    function createBgParticles() {
      const container = document.getElementById('bgParticles');
      const symbols = ['❤️', '💖', '✨', '🌸', '💕', '⭐', '🎈'];
      for (let i = 0; i < 15; i++) {
        const span = document.createElement('span');
        span.className = 'bg-shape';
        span.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        span.style.left = Math.random() * 100 + 'vw';
        span.style.animationDuration = (5 + Math.random() * 6) + 's';
        span.style.animationDelay = (Math.random() * 5) + 's';
        span.style.fontSize = (16 + Math.random() * 20) + 'px';
        container.appendChild(span);
      }
    }
    createBgParticles();

    const warningsStep1 = [
      "တကယ်လား? 🥺",
      "စဉ်းစားပါဦး... 💔",
      "No ကို မနှိပ်ပါနဲ့တော့နော်! 😭",
      "မနှိပ်ပါနဲ့တော့ ဆိုမှ... 🙈"
    ];

    const warningsStep2 = [
      "မိအောင် နှိပ်ကြည့်ပါဦး~ 😜",
      "နေရာချင်း လဲသွားပြီနော်! 🤪",
      "ဖမ်းလို့ မရဘူးလေ~ 👻",
      "မရဘူး..!😛",
      "ဟဲဟဲ..! 💖"
    ];

    let currentStep = 0; // အစဆုံး မျက်နှာပြင် (Step 0)
    let warningIndexStep1 = 0;
    let warningIndexStep2 = 0;
    let yesScaleStep1 = 1;
    let isSwappedStep2 = false;
    let isLockStep2 = false;

    let step1NoClicks = 0;
    let step2Choice = "";
    let step3Choice = "";

    renderStep();

    function renderStep() {
      const container = document.getElementById('mainContainer');

      if (currentStep === 0) {
        container.innerHTML = `
          <h1 style="margin-bottom: 20px;">ဟဲ့ရည်းစားလေး</h1>
          <div class="gif-container intro-gif-clickable" onclick="nextStep(1)">
            <img src="https://cdn.pixabay.com/animation/2026/03/15/04/38/04-38-14-772_512.gif" alt="Intro Cute Gif">
          </div>
          <p style="font-size: 13px; color: #666; font-style: italic; margin-top: 10px;">အလျော့ပေးတဲ့အနေနဲ့ ပန်းပေးတာ နှိပ်ကြည့်</p>
        `;
      } else if (currentStep === 1) {
        container.innerHTML = `
          <div class="step-badge">Hey Baby</div>
          <div class="gif-container">
            <img id="gifImage" src="https://media.tenor.com/E1xRYO8wXXMAAAAi/bubu-bubu-dudu.gif" alt="Sad Cute Gif">
          </div>
          <h1 id="questionText">စိတ်ဆိုးသေးလား?</h1>
          <div class="btn-group">
            <button class="btn-yes" id="yesBtn1" onclick="nextStep(2)">ဆိုးတော့ဘူး ❤️</button>
            <button class="btn-no" id="noBtn1" onclick="handleNoStep1()">ဆိုးတယ်ဟာ 💔</button>
          </div>
        `;
      } else if (currentStep === 2) {
        container.innerHTML = `
          <div class="step-badge" style="background: linear-gradient(45deg, #11998e, #38ef7d);">Step 2</div>
          <div class="gif-container">
            <img id="gifImage" src="https://media.tenor.com/jGhCgiy4v24AAAAi/bubu-dudu-sseeyall.gif" alt="Teasing Cute Gif">
          </div>
          <h1 id="questionText">တကယ်ပြေပြီလား.. 👉👈</h1>
          <div class="btn-group ${isSwappedStep2 ? 'swapped' : ''}" id="btnGroup2">
            <button class="btn-yes-step2" id="yesBtn2" onclick="chooseStep2('YES 🥰')">YES 🥰</button>
            <button class="btn-no-step2" id="noBtn2" onclick="handleNoStep2()">NO 😜</button>
          </div>
        `;
      } else if (currentStep === 3) {
        container.innerHTML = `
          <div class="step-badge" style="background: linear-gradient(45deg, #ff007f, #7928ca);">Step 3</div>
          <div class="gif-container">
            <img id="gifImage" src="https://media.tenor.com/X9h8i5MZg3YAAAAi/bubu-bubu-dudu.gif" alt="Super Cute Gif">
          </div>
          <h1 id="questionText">အဲ့ဒါဆို ချစ်လား... ❤️</h1>
          <div class="btn-group">
            <button class="btn-yes-step3" onclick="finishQuestions('YES 💖')">YES 💖</button>
            <button class="btn-aung-step3" onclick="finishQuestions('ချစ်တယ် 🌸')">ချစ်တယ် 🌸</button>
          </div>
        `;
      }
    }

    function nextStep(step) {
      const floatingNo = document.getElementById('noBtn1');
      if (floatingNo) floatingNo.remove();

      currentStep = step;
      renderStep();
    }

    function chooseStep2(choice) {
      step2Choice = choice;
      nextStep(3);
    }

    function handleNoStep1() {
      step1NoClicks++;

      const noBtn = document.getElementById('noBtn1');
      const yesBtn = document.getElementById('yesBtn1');

      if (!noBtn || !yesBtn) return;

      if (noBtn.parentElement !== document.body) {
        document.body.appendChild(noBtn);
      }

      const btnWidth = noBtn.offsetWidth || 100;
      const btnHeight = noBtn.offsetHeight || 45;

      const minX = 20;
      const maxX = Math.max(minX, window.innerWidth - btnWidth - 20);

      const minY = 70;
      const maxY = Math.max(minY, window.innerHeight - btnHeight - 30);

      const randomX = Math.floor(Math.random() * (maxX - minX + 1)) + minX;
      const randomY = Math.floor(Math.random() * (maxY - minY + 1)) + minY;

      noBtn.style.position = 'fixed';
      noBtn.style.left = `${randomX}px`;
      noBtn.style.top = `${randomY}px`;
      noBtn.style.zIndex = '9999';

      yesScaleStep1 += 0.15;
      yesBtn.style.transform = `scale(${yesScaleStep1})`;

      const warningY = randomY - 45;
      showWarning(randomX, warningY, warningsStep1[warningIndexStep1 % warningsStep1.length], 'warning-theme-1');
      warningIndexStep1++;
    }

    function handleNoStep2() {
      if (isLockStep2) return;
      isLockStep2 = true;

      const btnGroup = document.getElementById('btnGroup2');
      const noBtn = document.getElementById('noBtn2');
      
      isSwappedStep2 = !isSwappedStep2;
      if (btnGroup) {
        if (isSwappedStep2) {
          btnGroup.classList.add('swapped');
        } else {
          btnGroup.classList.remove('swapped');
        }
      }

      if (noBtn) {
        const rect = noBtn.getBoundingClientRect();
        showWarning(rect.left + (rect.width/2) - 40, rect.top - 45, warningsStep2[warningIndexStep2 % warningsStep2.length], 'warning-theme-2');
        warningIndexStep2++;
      }

      setTimeout(() => {
        isLockStep2 = false;
      }, 300);
    }

    function finishQuestions(choiceText) {
      step3Choice = choiceText;
      handleYesFinal(choiceText);
    }

    function showWarning(x, y, text, themeClass) {
      const warning = document.createElement('div');
      warning.className = `warning-popup ${themeClass}`;
      warning.innerText = text;

      const safeX = Math.min(window.innerWidth - 200, Math.max(10, x));
      const safeY = Math.max(10, y);

      warning.style.left = `${safeX}px`;
      warning.style.top = `${safeY}px`;

      document.body.appendChild(warning);

      setTimeout(() => {
        warning.remove();
      }, 1500);
    }

    function handleYesFinal(choiceText = 'YES') {
      const container = document.getElementById('mainContainer');
      
      container.innerHTML = `
        <div class="gif-container">
          <img src="https://media2.giphy.com/media/v1.Y2lkPTc5MGI3NjExZTU0dmJnOTl2dnhvNGZva216bDRzYjJ6czljemZuYXBlZjN0bWY3YiZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9Zw/QO6gybBh0d4LLTNn1d/giphy.gif" alt="Happy Gif">
        </div>
        <h1>Yay! '${choiceText}' လို့ ဖြေပေးလို့ ကျေးဇူး! ❤️✨</h1>
        <button class="btn-card" onclick="goToEpostcardPage()">E-postcard For You ✉️</button>
      `;
    }

    function goToEpostcardPage() {
      const container = document.getElementById('mainContainer');
      
      container.innerHTML = `
        <h1 style="margin-bottom: 10px; color: #ff2a74; font-size: 18px;">💌 Special Message For You</h1>
        <div class="envelope-container">
          <div class="envelope" id="envelope" onclick="toggleEnvelope()">
            <div class="envelope-flap"></div>
            <div class="envelope-pocket"></div>
            <div class="letter">
              <div class="letter-content">
                <p><b>တောင်းပန်စာ ✨</b><br><br>
                တောင်းပန်တယ် <br>
                စိတ်မကောက်နဲ့တော့<br>ပြေတော့."</p>
              </div>
              
              <div class="mini-btn-group" id="responseArea">
              </div>
            </div>
          </div>
        </div>
        <p class="instruction-text" id="instructText">👆 စာအိတ်လေးကို နှိပ်ပြီး စာထုတ်ဖတ်ပါ</p>
      `;
    }

    function toggleEnvelope() {
      const envelope = document.getElementById('envelope');
      const instructText = document.getElementById('instructText');
      
      envelope.classList.toggle('open');
      
      if (envelope.classList.contains('open')) {
        instructText.innerText = "အဖြေတစ်ခုခုကို ရွေးပေးပါနော် ✨";
      } else {
        instructText.innerText = "👆 စာအိတ်လေးကို နှိပ်ပြီး စာထုတ်ဖတ်ပါ";
      }
    }

    function sendResponse(event, answer) {
      event.stopPropagation();
      
      const responseArea = document.getElementById('responseArea');
      responseArea.innerHTML = `<span style="font-size:11px; color:#2c5364; font-weight:bold;">အဖြေပို့နေပါသည်။...</span>`;

      fetch("", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Accept": "application/json"
        },
        body: JSON.stringify({
          "အဆင့် (၁) ရွေးချယ်မှု": `YES နှိပ်ခဲ့သည် (NO ကို ${step1NoClicks} ကြိမ်တိုင်တိုင် နှိပ်ခဲ့ပါသည်)`,
          "အဆင့် (၂) ရွေးချယ်မှု": step2Choice || "YES 🥰",
          "အဆင့် (၃) ရွေးချယ်မှု": step3Choice || "YES 💖",
          "စာအိတ်ထဲမှ နောက်ဆုံးအဖြေ": answer,
          "ပို့သည့်အချိန်": new Date().toLocaleString()
        })
      })
      .then(response => {
        responseArea.innerHTML = `<span style="font-size:11px; color:#2ecc71; font-weight:bold;">အဖြေကို ပို့ပေးလိုက်ပါပြီ! ✨</span>`;
      })
      .catch(error => {
        responseArea.innerHTML = `<span style="font-size:11px; color:#2ecc71; font-weight:bold;">အဖြေကို ပို့ပေးလိုက်ပါပြီ! ✨</span>`;
      });
    }
  </script>
